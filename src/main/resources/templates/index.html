<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Calculadora </title>
</head>
<body>


<h1> Calculadora </h1>

//controller eh a calculadora, o end point eh o metodo calcular
<form th:action ="@{/calculadora/calcular}" method ="get">

    <label> Numero 1 :

        <input type ="number" name ="a" th:value ="${a}">

    </label>

    <label> Numero 2 :

        <input type ="number" name ="b" th:value ="${b}">

    </label>

    <select name ="operacao">

        <option value ="somar"> Somar </option>
        <option value ="subtrair"> Subtrair </option>
        <option value ="multiplicar"> Multiplicar </option>
        <option value ="dividir"> Dividir </option>

    </select>

    <button type ="submit"> Calcular </button>

</form>

<p th:if="${resultado != null}" th:text="${resultado}">  </p>

</body>
</html>
